<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 移动端优先：告诉手机浏览器不要缩放页面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Ceramic{% endblock %}</title>
    <!-- 引入 Bootstrap 5 (UI 框架) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 这里预留给 Facebook Open Graph 标签 -->
    {% block og_tags %}
        <!-- 默认的全店兜底 OG 标签（当分享首页时会显示这个） -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="My Ceramic Shop | Premium Handcrafted Ceramics" />
        <meta property="og:description" content="Discover our exclusive collection of beautiful, high-quality handcrafted ceramics for your home and lifestyle." />
        <!-- 获取当前页面的完整 URL -->
        <meta property="og:url" content="{{ request.build_absolute_uri }}" />
        <!--
            强烈建议：找一张店铺的品牌 Logo 或者是最好看的一张全景图。
            把它放在 static 文件夹里，然后在这里加上类似下面的代码作为默认封面：
            <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}/static/images/shop_cover.jpg" />
        -->
    {% endblock %}
</head>
<body>
    <!-- 简单的导航栏 -->
    <nav class="navbar navbar-expand-lg bg-body-secondary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🏛️ My Ceramic Shop</a>
            <button id="darkModeToggle" class="btn btn-outline-secondary border-0 fs-5" title="Toggle Dark Mode">
                🌙
            </button>
        </div>
    </nav>

    <!-- 网页核心内容，子页面会替换掉 block content -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 暗色模式 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const htmlElement = document.documentElement;
            const toggleBtn = document.getElementById('darkModeToggle');

            // 1. 获取本地存储的偏好，或者获取操作系统的偏好
            const getPreferredTheme = () => {
                const storedTheme = localStorage.getItem('theme');
                if (storedTheme) {
                    return storedTheme;
                }
                // 如果本地没有记录，则检查手机系统是不是暗色模式
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };

            // 2. 设置主题的函数
            const setTheme = (theme) => {
                // 修改 <html> 标签的 data-bs-theme 属性，Bootstrap 会自动切换全站颜色！
                htmlElement.setAttribute('data-bs-theme', theme);
                // 切换按钮图标
                toggleBtn.innerHTML = theme === 'dark' ? '☀️' : '🌙';
            };

            // 3. 网页加载时，立刻应用主题
            setTheme(getPreferredTheme());

            // 4. 监听按钮点击事件
            toggleBtn.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                // 设置新主题
                setTheme(newTheme);
                // 存入 LocalStorage，下次打开网页直接生效
                localStorage.setItem('theme', newTheme);
            });
        });
    </script>

</body>
</html>
